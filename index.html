<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ビジュアル・サイエンス・ラボ</title>
    <style>
        :root {
            --bg-color: #f0f6fc;
            --main-font: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            --primary: #3498db;
            --primary-hover: #2980b9;
            --text: #2c3e50;
        }

        body {
            font-family: var(--main-font);
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 900px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        h1 { margin: 0; font-size: 1.5rem; }
        p { margin: 5px 0 0; color: #7f8c8d; font-size: 0.9rem; }

        .game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            padding: 15px;
        }

        .scene {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            position: relative;
            height: 280px;
        }

        .scene-title {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 1rem;
            z-index: 10;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #eef2f5;
            border-radius: 8px;
        }

        .controls {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn.active { background: #e74c3c; } /* 停止状態 */

        .data-panel {
            position: absolute;
            bottom: 45px;
            left: 10px;
            right: 10px;
            background: rgba(255,255,255,0.9);
            padding: 5px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: monospace;
            display: flex;
            justify-content: space-between;
            border: 1px solid #ccc;
            pointer-events: none;
        }

        .annotation {
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🔬 ビジュアル・サイエンス・ラボ</h1>
        <p>画像のような自然現象をシミュレーション。動かして原因を学ぼう！</p>
    </header>

    <div class="game-area">
        <!-- 1. 雲のでき方 -->
        <div class="scene" id="cloudScene">
            <div class="scene-title">雲のでき方</div>
            <canvas id="cloudCanvas"></canvas>
            <div class="data-panel" id="cloudData">地表(0m): 20°C</div>
            <div class="controls">
                <button class="btn" id="btnCloudPlay">再生/停止</button>
                <button class="btn" id="btnCloudReset">リセット</button>
            </div>
        </div>

        <!-- 2. 地震メカニズム -->
        <div class="scene" id="quakeScene">
            <div class="scene-title">地震メカニズム</div>
            <canvas id="quakeCanvas"></canvas>
            <div class="data-panel" id="quakeData">歪み: 0% | 固着域: 安定</div>
            <div class="controls">
                <button class="btn" id="btnQuakePlay">再生/停止</button>
                <button class="btn" id="btnQuakeReset">リセット</button>
            </div>
        </div>

        <!-- 3. フェーン現象 -->
        <div class="scene" id="foehnScene">
            <div class="scene-title">フェーン現象</div>
            <canvas id="foehnCanvas"></canvas>
            <div class="data-panel" id="foehnData">風上(0m): 20°C</div>
            <div class="controls">
                <button class="btn" id="btnFoehnPlay">再生/停止</button>
                <button class="btn" id="btnFoehnReset">リセット</button>
            </div>
        </div>

        <!-- 4. エルニーニョ現象 -->
        <div class="scene" id="elninoScene">
            <div class="scene-title">エルニーニョ現象</div>
            <canvas id="elninoCanvas"></canvas>
            <div class="controls">
                <button class="btn active" id="btnNormal">通常時</button>
                <button class="btn" id="btnElnino">エルニーニョ時</button>
            </div>
        </div>
    </div>
</div>

<script>
    // 汎用描画関数、定数
    const getCtx = id => document.getElementById(id).getContext('2d');

    /* --- 1. 雲のでき方 (Cloud Formation) --- */
    (function() {
        const canvas = document.getElementById('cloudCanvas');
        const ctx = canvas.getContext('2d');
        const dataPanel = document.getElementById('cloudData');
        const W = canvas.width = 420; const H = canvas.height = 250;
        let running = false, time = 0, state = 'reset';

        const LCL = 1200; // 凝結レベル（メートル）

        function drawBaseScene(t) {
            ctx.clearRect(0, 0, W, H);
            // 空のグラデーション
            let sky = ctx.createLinearGradient(0, 0, 0, H);
            sky.addColorStop(0, '#a1c4fd'); sky.addColorStop(1, '#c2e9fb');
            ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

            // 山と地表
            ctx.fillStyle = '#6ab04c'; ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(150, H - 120); ctx.lineTo(300, H); ctx.fill();
            ctx.fillStyle = '#228b22'; ctx.fillRect(0, H - 10, W, 10);

            // アノテーション
            ctx.font = '12px Arial'; ctx.fillStyle = '#333';
            ctx.fillText('上昇気流 (Updraft)', 10, 50);
            ctx.fillText('水蒸気 (Water Vapor)', 10, 200);
            
            // 凝結レベル線
            ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(0,0,0,0.5)';
            const lclY = H - (LCL/2000) * (H-10);
            ctx.beginPath(); ctx.moveTo(0, lclY); ctx.lineTo(W, lclY); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillText('凝結レベル (LCL)', 10, lclY - 5);
        }

        function drawCloudAndAir(t) {
            if (!running) return;
            const tScaled = t / 100;
            const h_m = Math.min(1900, tScaled * 20); // 1.9kmまで
            const airX = Math.min(150, tScaled * 1.5);
            const airY = H - (h_m / 2000) * (H-10) - 10;

            // 空気塊
            ctx.fillStyle = h_m < LCL ? 'rgba(52, 152, 219, 0.6)' : 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath(); ctx.arc(airX, airY, 15, 0, Math.PI * 2); ctx.fill();

            // 雲の発生（LCL以上）
            if (h_m > LCL) {
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath();
                ctx.arc(airX+20, airY-10, 30, 0, Math.PI*2); ctx.arc(airX-10, airY-20, 25, 0, Math.PI*2);
                ctx.arc(airX+40, airY-20, 25, 0, Math.PI*2); ctx.fill();
            }

            // データ更新
            dataPanel.innerText = `高度: ${Math.round(h_m)}m | 状態: ${h_m < LCL ? '水蒸気' : '凝結(雲)'}`;
        }

        function loop() { drawBaseScene(time); drawCloudAndAir(time); time++; requestAnimationFrame(loop); }
        loop();

        document.getElementById('btnCloudPlay').onclick = function() { running = !running; this.classList.toggle('active'); };
        document.getElementById('btnCloudReset').onclick = function() { running = false; time = 0; drawBaseScene(0); document.getElementById('btnCloudPlay').classList.remove('active'); dataPanel.innerText = "地表(0m): 20°C"; };
    })();

    /* --- 2. 地震メカニズム (Earthquake) --- */
    (function() {
        const canvas = document.getElementById('quakeCanvas');
        const ctx = canvas.getContext('2d');
        const dataPanel = document.getElementById('quakeData');
        const W = canvas.width = 420; const H = canvas.height = 250;
        let running = false, strain = 0, shaking = 0, state = 'reset';

        function drawBaseScene(s) {
            ctx.clearRect(0, 0, W, H);
            // 陸側プレート
            ctx.fillStyle = '#a1887f'; ctx.beginPath(); ctx.moveTo(0, 100); ctx.lineTo(250, 100); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
            // 海側プレート
            ctx.fillStyle = '#546e7a'; ctx.beginPath(); ctx.moveTo(250, 100); ctx.lineTo(W, 100); ctx.lineTo(W, H); ctx.fill();
            // 海面
            ctx.fillStyle = 'rgba(52, 152, 219, 0.4)'; ctx.fillRect(0, 0, W, 100);

            // アノテーション
            ctx.font = '11px Arial'; ctx.fillStyle = '#fff';
            ctx.fillText('陸側プレート', 50, 150); ctx.fillText('海側プレート', 280, 180);
            ctx.fillText('歪みの蓄積', 160, 220);

            // 固着域の描画（歪みに応じて色と太さが変わる）
            ctx.strokeStyle = `rgb(${255}, ${255 - s*2.5}, 0)`;
            ctx.lineWidth = 3 + s/10;
            ctx.beginPath(); ctx.moveTo(250, 100); ctx.lineTo(W - (W-250)/2, (100+H)/2); ctx.stroke();
            ctx.lineWidth = 1; ctx.setLineDash([]);
        }

        function play() {
            if (!running) return;
            strain += 0.5;
            if (strain > 100) { // 跳ね返り発動
                strain = 0; shaking = 20;
            }
            drawBaseScene(strain);

            // 振動
            if (shaking > 0) {
                const dx = (Math.random()-0.5) * shaking; const dy = (Math.random()-0.5) * shaking;
                ctx.translate(dx, dy); shaking *= 0.9;
            }

            dataPanel.innerText = `歪み: ${Math.round(strain)}% | 固着域: ${strain > 80 ? '限界近し' : '安定'}`;
            requestAnimationFrame(play);
        }

        drawBaseScene(0);
        document.getElementById('btnQuakePlay').onclick = function() { running = !running; this.classList.toggle('active'); play(); };
        document.getElementById('btnQuakeReset').onclick = function() { running = false; strain = 0; shaking = 0; drawBaseScene(0); dataPanel.innerText = "歪み: 0% | 固着域: 安定"; };
    })();

    /* --- 3. フェーン現象 (Foehn) --- */
    (function() {
        const canvas = document.getElementById('foehnCanvas');
        const ctx = canvas.getContext('2d');
        const dataPanel = document.getElementById('foehnData');
        const W = canvas.width = 420; const H = canvas.height = 250;
        let running = false, time = 0;

        const WINDWARD_T = 20; // 風上の気温

        function drawBaseScene() {
            ctx.clearRect(0, 0, W, H);
            let sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#e0f7fa'); sky.addColorStop(1, '#b2ebf2');
            ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

            // 地形
            ctx.fillStyle = '#8d6e63'; ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(W/2, 100); ctx.lineTo(W, H); ctx.fill();
            ctx.fillStyle = '#388e3c'; ctx.fillRect(0, H-10, W, 10);

            // アノテーション
            ctx.font = '12px Arial'; ctx.fillStyle = '#333';
            ctx.fillText('風上 (Windward)', 10, H - 30); ctx.fillText('風下 (Leeward)', W - 90, H - 30);
            ctx.fillText('地形性降雨', W/2 - 70, 130); ctx.fillText('乾燥した下降気流', W/2 + 20, 130);
        }

        function drawAirAndTemp(t) {
            if (!running) return;
            drawBaseScene(); // 背景を再描画

            const tScaled = t / 100;
            const x = Math.min(W, tScaled * 2);
            let h_m, temp, state;

            if (x < W/2) { // 登り
                h_m = (x / (W/2)) * 1000;
                temp = WINDWARD_T - (h_m/100) * 0.5; // 0.5°C/100m
                state = "登り (湿潤)";
                // 雨
                if (t % 10 < 5) {
                    ctx.strokeStyle = 'blue'; ctx.beginPath();
                    for(let i=0; i<5; i++) { ctx.moveTo(x-20+i*5, 100+i*5); ctx.lineTo(x-20+i*5, 115+i*5); } ctx.stroke();
                }
            } else { // 降下
                h_m = 1000 - ((x - W/2) / (W/2)) * 1000;
                temp = WINDWARD_T - 5 + ((W/2 - h_m/10)/100) * 1.0; // 1.0°C/100m
                temp = WINDWARD_T - 5 + (x-W/2)/(W/2) * 10;
                temp = 15 + ((1000 - h_m) / 100); // 乾燥断熱
                temp = WINDWARD_T - 5 + (1000-h_m)/100; // これは間違い、再計算

                // 山頂(1000m)で15°C、そこから100mにつき1°C上昇
                temp = (WINDWARD_T - 5) + ( (1000 - h_m) / 100 );
                state = "降下 (乾燥)";
            }

            // 空気塊
            const y = H - (h_m / 1000) * (H-100) - 20;
            ctx.fillStyle = x < W/2 ? 'blue' : 'red';
            ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();

            // 温度ゲージ表示（キャンバス上）
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x-25, y-35, 50, 15);
            ctx.fillStyle = 'white'; ctx.fillText(`${temp.toFixed(1)}°C`, x-20, y-25);

            dataPanel.innerText = `位置: ${Math.round(x)}m | 高度: ${Math.round(h_m)}m | 状態: ${state}`;
            time++;
            requestAnimationFrame(() => drawAirAndTemp(time));
        }

        drawBaseScene();
        document.getElementById('btnFoehnPlay').onclick = function() { running = !running; this.classList.toggle('active'); drawAirAndTemp(time); };
        document.getElementById('btnFoehnReset').onclick = function() { running = false; time = 0; drawBaseScene(); dataPanel.innerText = "風上(0m): 20°C"; };
    })();

    /* --- 4. エルニーニョ現象 (El Niño) --- */
    (function() {
        const canvas = document.getElementById('elninoCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width = 420; const H = canvas.height = 250;
        let mode = 'normal';

        function drawScene() {
            ctx.clearRect(0, 0, W, H);
            // 太平洋のベースグラデーション（水温）
            let seaGrad = ctx.createLinearGradient(0, 0, W, 0);
            if (mode === 'normal') {
                seaGrad.addColorStop(0, '#e74c3c'); // 西(インドネシア)側が赤い
                seaGrad.addColorStop(0.7, '#3498db'); // 東(ペルー)側が青い
            } else {
                seaGrad.addColorStop(0, '#e74c3c');
                seaGrad.addColorStop(0.5, '#e74c3c'); // 赤い部分が中央に広がる
                seaGrad.addColorStop(1, '#3498db');
            }
            ctx.fillStyle = seaGrad; ctx.fillRect(50, 100, W - 100, 100);

            // 陸地
            ctx.fillStyle = '#f1c40f'; ctx.fillRect(0, 100, 50, 100); ctx.fillRect(W - 50, 100, 50, 100);

            // 貿易風（矢印）
            ctx.strokeStyle = 'white'; ctx.lineWidth = mode === 'normal' ? 4 : 1;
            ctx.beginPath(); ctx.moveTo(W - 80, 120); ctx.lineTo(80, 120); ctx.lineTo(90, 115); ctx.moveTo(80, 120); ctx.lineTo(90, 125); ctx.stroke();
            
            // アノテーション
            ctx.font = '11px Arial'; ctx.fillStyle = '#fff';
            ctx.fillText(mode === 'normal' ? '強力な貿易風' : '貿易風が弱まる', W/2 - 40, 115);
            ctx.fillText('通常時（冷水湧き上がり）', W - 140, 180);
            ctx.fillStyle = mode === 'elnino' ? '#e74c3c' : '#333';
            ctx.fillText(mode === 'elnino' ? '海水温アノマリー（高温）' : '', W/2 - 50, 150);
        }

        drawScene();
        document.getElementById('btnNormal').onclick = function() { mode = 'normal'; this.classList.add('active'); document.getElementById('btnElnino').classList.remove('active'); drawScene(); };
        document.getElementById('btnElnino').onclick = function() { mode = 'elnino'; this.classList.add('active'); document.getElementById('btnNormal').classList.remove('active'); drawScene(); };
    })();

</script>

</body>
</html>
