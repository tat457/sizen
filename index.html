<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアル自然現象サイエンス・ラボ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background-color: #090d16;
      color: #f8fafc;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100 p-4 md:p-6">

  <!-- ヘッダー -->
  <header class="max-w-6xl w-full mx-auto mb-4 flex flex-col md:flex-row items-center justify-between gap-4 glass-panel p-4 rounded-2xl">
    <div class="flex items-center gap-3">
      <div class="p-3 bg-blue-600/30 text-blue-400 rounded-xl border border-blue-500/30">
        <i data-lucide="globe" class="w-7 h-7"></i>
      </div>
      <div>
        <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-blue-400 via-teal-300 to-amber-300 bg-clip-text text-transparent">
          リアル自然現象サイエンス・ラボ
        </h1>
        <p class="text-xs text-slate-400">厳密な物理法則モデルと高精細グラフィックによるインタラクティブ学習環境</p>
      </div>
    </div>

    <!-- タブ切り替え -->
    <nav class="flex flex-wrap gap-2 bg-slate-900/90 p-1.5 rounded-xl border border-slate-800">
      <button onclick="switchTab('cloud')" id="tab-cloud" class="tab-btn flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-semibold transition-all duration-200">
        <i data-lucide="cloud-rain" class="w-4 h-4"></i> 雲の形成
      </button>
      <button onclick="switchTab('earthquake')" id="tab-earthquake" class="tab-btn flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-semibold transition-all duration-200">
        <i data-lucide="activity" class="w-4 h-4"></i> 地震メカニズム
      </button>
      <button onclick="switchTab('foehn')" id="tab-foehn" class="tab-btn flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-semibold transition-all duration-200">
        <i data-lucide="mountain" class="w-4 h-4"></i> フェーン現象
      </button>
      <button onclick="switchTab('elnino')" id="tab-elnino" class="tab-btn flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-semibold transition-all duration-200">
        <i data-lucide="waves" class="w-4 h-4"></i> エルニーニョ
      </button>
    </nav>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-6xl w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">
    
    <!-- ビジュアルキャンバス (2カラム分) -->
    <div class="lg:col-span-2 flex flex-col gap-4">
      <div class="glass-panel rounded-2xl p-2 relative overflow-hidden flex flex-col items-center justify-center border border-slate-800 shadow-2xl">
        <canvas id="simCanvas" width="850" height="480" class="w-full h-auto rounded-xl bg-slate-950 border border-slate-800/80"></canvas>
      </div>
      
      <!-- 下部リアルタイム数値インジケーター -->
      <div id="metricsBar" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <!-- 動的にJavaScriptから挿入 -->
      </div>
    </div>

    <!-- サイドパネル: 操作＆解説 -->
    <div class="flex flex-col gap-4">
      
      <!-- 操作コントロール -->
      <div class="glass-panel p-5 rounded-2xl flex flex-col gap-4">
        <h2 class="text-base font-bold text-slate-200 flex items-center gap-2 border-b border-slate-700/50 pb-2">
          <i data-lucide="sliders" class="w-5 h-5 text-teal-400"></i> シミュレーション操作
        </h2>
        
        <div id="controlsContainer" class="flex flex-col gap-4">
          <!-- 各現象用コントロールをJSで注入 -->
        </div>
      </div>

      <!-- メカニズム解説 -->
      <div class="glass-panel p-5 rounded-2xl flex flex-col gap-3 flex-grow">
        <h2 class="text-base font-bold text-slate-200 flex items-center gap-2 border-b border-slate-700/50 pb-2">
          <i data-lucide="book-open" class="w-5 h-5 text-blue-400"></i> 科学的メカニズム解説
        </h2>
        <div id="explanationContainer" class="text-sm text-slate-300 leading-relaxed flex flex-col gap-2">
          <!-- 解説テキストをJSで注入 -->
        </div>
      </div>

    </div>

  </main>

  <footer class="max-w-6xl w-full mx-auto mt-6 text-center text-xs text-slate-500 py-2">
    自然現象インタラクティブ・シミュレーター — High Precision Physics & Atmospheric Engine
  </footer>

<script>
  lucide.createIcons();

  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  
  let currentTab = 'cloud';
  let animId = null;
  let particles = [];
  let cloudPuffs = [];
  let simState = {};

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.remove('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-600/30');
      btn.classList.add('text-slate-400', 'hover:text-slate-200', 'hover:bg-slate-800/50');
    });

    const activeBtn = document.getElementById(`tab-${tab}`);
    activeBtn.classList.remove('text-slate-400', 'hover:text-slate-200', 'hover:bg-slate-800/50');
    activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-600/30');

    initSimulation();
  }

  class Particle {
    constructor(x, y, vx, vy, color, radius, life = 100) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.color = color;
      this.radius = radius;
      this.life = life;
      this.maxLife = life;
      this.alpha = 1;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life--;
      this.alpha = Math.max(0, this.life / this.maxLife);
    }
    draw(context) {
      context.save();
      context.globalAlpha = this.alpha;
      context.fillStyle = this.color;
      context.beginPath();
      context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      context.fill();
      context.restore();
    }
  }

  // リアルな積雲（もこもこした雲パフ）描画クラス
  class CloudPuff {
    constructor(x, y, radius) {
      this.x = x;
      this.y = y;
      this.baseRadius = radius;
      this.radius = radius;
      this.alpha = 0.1;
      this.targetAlpha = 0.85;
      this.offsetAngle = Math.random() * Math.PI * 2;
    }
    update() {
      if (this.alpha < this.targetAlpha) {
        this.alpha += 0.02;
      }
      this.radius = this.baseRadius + Math.sin(Date.now() * 0.002 + this.offsetAngle) * 2;
    }
    draw(context) {
      context.save();
      context.globalAlpha = this.alpha;

      // 雲パフの3D的な立体グラデーション（上面ハイライト、下面影）
      let grad = context.createRadialGradient(
        this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.1,
        this.x, this.y, this.radius
      );
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.65, '#e2e8f0');
      grad.addColorStop(1, 'rgba(148, 163, 184, 0.4)');

      context.fillStyle = grad;
      context.beginPath();
      context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      context.fill();
      context.restore();
    }
  }

  function initSimulation() {
    if (animId) cancelAnimationFrame(animId);
    particles = [];
    cloudPuffs = [];
    
    const controls = document.getElementById('controlsContainer');
    const explanation = document.getElementById('explanationContainer');
    const metrics = document.getElementById('metricsBar');

    if (currentTab === 'cloud') {
      simState = {
        altitude: 0,        // m (0 ~ 2500m)
        temp: 25.0,         // ℃ (地表)
        dewPoint: 15.0,     // 露点 (1000mで到達)
        pressure: 1013,     // hPa
        isRising: false,
        condensationHeight: 1000 // m
      };

      controls.innerHTML = `
        <button id="btnRise" onclick="simState.isRising = !simState.isRising" class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 font-bold text-white rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
          <i data-lucide="arrow-up-circle"></i> 空気の断熱上昇を切り替え
        </button>
        <button onclick="initSimulation()" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition flex items-center justify-center gap-2">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i> リセット
        </button>
      `;

      explanation.innerHTML = `
        <p><strong class="text-cyan-400">1. 断熱膨張 (乾燥断熱減率):</strong> 上昇する空気塊は気圧低下により膨張し、熱を消費して約1.0℃/100mのペースで急冷します。</p>
        <p><strong class="text-blue-400">2. 露点高度 (LCL) と凝縮:</strong> 気温が露点(15℃)に達する高度(1000m)で飽和し、透明な水蒸気が「雲粒（微小な水滴）」へと状態変化（凝縮）を始めます。</p>
        <p><strong class="text-teal-400">3. 潜熱放出と雲の発達 (湿潤断熱減率):</strong> 水蒸気が凝縮する際「水蒸気潜熱」を放つため、凝縮後の冷却は緩やかになり(約0.5℃/100m)、力強い積雲（わた雲）へと成長します。</p>
      `;

      metrics.innerHTML = `
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">高度</div><div id="m-alt" class="text-lg font-bold text-cyan-400">0 m</div></div>
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">空気の気温</div><div id="m-temp" class="text-lg font-bold text-amber-400">25.0 ℃</div></div>
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">露点温度</div><div id="m-dew" class="text-lg font-bold text-indigo-400">15.0 ℃</div></div>
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">大気状態</div><div id="m-state" class="text-lg font-bold text-emerald-400">未飽和（透明）</div></div>
      `;

      loopCloud();
    }
    else if (currentTab === 'earthquake') {
      simState = {
        strain: 0,          // 0 - 100%
        isAutoSubducting: false,
        earthquakeActive: false,
        seismicWaves: [],
        tsunamiHeight: 0
      };

      controls.innerHTML = `
        <button onclick="addEarthquakeStrain(20)" class="w-full py-3 px-4 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 font-bold text-white rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
          <i data-lucide="arrow-down-right"></i> 海側プレートを沈み込ませる (+20%)
        </button>
        <button id="btnAutoSubduct" onclick="simState.isAutoSubducting = !simState.isAutoSubducting" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition flex items-center justify-center gap-2">
          <i data-lucide="play"></i> 連続沈み込み（自動）
        </button>
        <button onclick="initSimulation()" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition flex items-center justify-center gap-2">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i> リセット
        </button>
      `;

      explanation.innerHTML = `
        <p><strong class="text-amber-400">1. 明確なプレート境界 (固着域):</strong> 沈み込む「海洋プレート」と引き込まれる「陸側プレート」の接触面（固着域）にひずみが溜まります。</p>
        <p><strong class="text-orange-400">2. 海溝と陸側プレートの引き込み:</strong> 海洋プレートの沈み込みに伴い、境界付近の陸側先端部が下方へ強く引っ張られて変形します。</p>
        <p><strong class="text-red-400">3. 弾性リバウンド（津波・地震波）:</strong> ひずみが限界(100%)を超えると固着域が破壊され、陸側プレートが一気に跳ね上がり、巨大地震波と海面急上昇（津波）を発生させます。</p>
      `;

      metrics.innerHTML = `
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">固着域ひずみ</div><div id="m-strain" class="text-lg font-bold text-amber-400">0 %</div></div>
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">プレート境界状態</div><div id="m-pstatus" class="text-lg font-bold text-emerald-400">固着・歪み蓄積中</div></div>
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">マグニチュード</div><div id="m-mag" class="text-lg font-bold text-slate-400">--</div></div>
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">津波高度</div><div id="m-tsunami" class="text-lg font-bold text-slate-400">0.0 m</div></div>
      `;

      loopEarthquake();
    }
    else if (currentTab === 'foehn') {
      simState = {
        airProgress: 0, // 0.0 to 1.0 (海側0m -> 雲発生1000m -> 山頂3000m -> 風下平野0m)
        isRunning: false,
        particles: []
      };

      controls.innerHTML = `
        <button onclick="simState.isRunning = true" class="w-full py-3 px-4 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 font-bold text-white rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
          <i data-lucide="wind"></i> 湿った風を送信（山越え開始）
        </button>
        <button onclick="initSimulation()" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold transition flex items-center justify-center gap-2">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i> リセット
        </button>
      `;

      explanation.innerHTML = `
        <p><strong class="text-blue-400">1. 風上上昇 (乾燥断熱 1.0℃/100m):</strong> 20.0℃の風上空気(0m)が山に衝突して上昇。1000mで10.0℃になり露点に到達します。</p>
        <p><strong class="text-teal-400">2. 降雨と潜熱加熱 (湿潤断熱 0.5℃/100m):</strong> 1000m〜3000mでは雨を降らせつつ潜熱（水蒸気の凝縮熱）を得るため、冷却が緩やかになり山頂(3000m)で0.0℃になります。</p>
        <p><strong class="text-rose-400">3. 風下吹き降り (乾燥断熱 1.0℃/100m):</strong> 水分を失ったカラカラの乾燥空気は、山頂(0℃)から麓(0m)まで急激に1.0℃/100mで昇温！麓では<span class="text-rose-400 font-bold">30.0℃（風上より10℃も高温）</span>となります！</p>
      `;

      metrics.innerHTML = `
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">風上（海側0m）</div><div class="text-lg font-bold text-cyan-400">20.0 ℃</div></div>
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">山頂（3000m）</div><div id="m-f-top" class="text-lg font-bold text-blue-300">0.0 ℃</div></div>
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">風下（平野0m）</div><div id="m-f-down" class="text-lg font-bold text-rose-400">30.0 ℃</div></div>
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">現在地気温</div><div id="m-f-cur" class="text-lg font-bold text-amber-300">20.0 ℃</div></div>
      `;

      loopFoehn();
    }
    else if (currentTab === 'elnino') {
      simState = {
        mode: 'normal',
        particles: []
      };

      controls.innerHTML = `
        <div class="grid grid-cols-1 gap-2">
          <button onclick="setElninoMode('normal')" id="mode-normal" class="el-mode-btn py-2.5 px-4 bg-blue-600 text-white font-bold rounded-xl shadow transition flex items-center justify-between">
            <span>平常時（正常な貿易風）</span> <i data-lucide="check-circle" class="w-4 h-4"></i>
          </button>
          <button onclick="setElninoMode('elnino')" id="mode-elnino" class="el-mode-btn py-2.5 px-4 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold rounded-xl transition flex items-center justify-between">
            <span>エルニーニョ現象（貿易風衰退）</span> <i data-lucide="flame" class="w-4 h-4 text-rose-400"></i>
          </button>
          <button onclick="setElninoMode('lanina')" id="mode-lanina" class="el-mode-btn py-2.5 px-4 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold rounded-xl transition flex items-center justify-between">
            <span>ラニーニャ現象（貿易風強化）</span> <i data-lucide="snowflake" class="w-4 h-4 text-cyan-400"></i>
          </button>
        </div>
      `;

      explanation.innerHTML = `
        <p><strong class="text-blue-400">1. 平常時:</strong> 東からの貿易風により、温かい表層海水が西側（インドネシア沖）に吹き寄せられ、東側（ペルー沖）では深海から冷水が湧き上がります。</p>
        <p><strong class="text-rose-400">2. エルニーニョ現象:</strong> 貿易風が弱まると、西に溜まっていた温水が東側へ戻り、東部太平洋の海面水温が上昇。湧昇流が遮断されます。</p>
        <p><strong class="text-cyan-400">3. ラニーニャ現象:</strong> 貿易風が強まりすぎると、西側への温水集中と東側での冷水湧き上がりが強まり、ペルー沖が異常低温になります。</p>
      `;

      metrics.innerHTML = `
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">貿易風</div><div id="m-wind" class="text-lg font-bold text-amber-400">標準 (東風)</div></div>
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">ペルー沖水温</div><div id="m-sst" class="text-lg font-bold text-blue-400">±0.0 ℃</div></div>
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">積乱雲活発域</div><div id="m-cloud-loc" class="text-lg font-bold text-emerald-400">西太平洋</div></div>
        <div class="glass-panel p-3 rounded-xl border border-slate-800 text-center"><div class="text-xs text-slate-400">冷水湧昇流</div><div id="m-upwelling" class="text-lg font-bold text-cyan-400">正常</div></div>
      `;

      loopElnino();
    }
    
    lucide.createIcons();
  }

  // ==========================================
  // 1. ☁️ 雲の形成（高精度プロセジュラル・パフ描画）
  // ==========================================
  function loopCloud() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 物理シミュレーション演算
    if (simState.isRising && simState.altitude < 2400) {
      simState.altitude += 5;
      
      // 乾燥断熱(1.0℃/100m) vs 湿潤断熱(0.5℃/100m)
      if (simState.altitude <= simState.condensationHeight) {
        simState.temp = 25.0 - (simState.altitude / 100);
      } else {
        let baseTemp = 25.0 - (1000 / 100); // 15.0℃
        let excessAlt = simState.altitude - 1000;
        simState.temp = baseTemp - (excessAlt * 0.005);
      }
    }

    // 上空のグラデーション（高度に応じた色変化）
    let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, '#0f172a');
    skyGrad.addColorStop(0.6, '#1e3a8a');
    skyGrad.addColorStop(1, '#38bdf8');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 高度基準線 (露点高度 LCL = 1000m)
    let lclY = 400 - (1000 / 2500) * 320; // 272px
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(0, lclY);
    ctx.lineTo(canvas.width, lclY);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#7dd3fc';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('── 露点高度 (LCL = 1000m / 露点15.0℃到達ライン) ──', 20, lclY - 8);

    // 地面描画
    ctx.fillStyle = '#15803d';
    ctx.fillRect(0, 420, canvas.width, 60);

    // 上昇空気塊の位置計算
    let airY = 400 - (simState.altitude / 2500) * 320;
    let airX = 425;

    // 水蒸気粒子（1000m未満）
    if (simState.altitude < 1000) {
      if (Math.random() < 0.6) {
        particles.push(new Particle(
          airX + (Math.random() - 0.5) * 40,
          airY + (Math.random() - 0.5) * 20,
          (Math.random() - 0.5) * 0.8,
          -1 - Math.random(),
          'rgba(186, 230, 253, 0.6)',
          3 + Math.random() * 3,
          40
        ));
      }
    } else {
      // 1000m以上：もこもこした雲パフの連続生長
      if (Math.random() < 0.45) {
        let cloudPuffX = airX + (Math.random() - 0.5) * (60 + (simState.altitude - 1000) * 0.08);
        let cloudPuffY = airY + (Math.random() - 0.5) * 30;
        let puffRadius = 16 + Math.random() * 22;
        cloudPuffs.push(new CloudPuff(cloudPuffX, cloudPuffY, puffRadius));
      }
    }

    // 水蒸気粒子アップデート
    particles.forEach((p, idx) => {
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(idx, 1);
    });

    // 雲パフ描画（リアルな積雲クラスタ）
    cloudPuffs.forEach(puff => {
      puff.update();
      puff.draw(ctx);
    });

    // 空気塊の領域バウンディング表示
    ctx.strokeStyle = simState.altitude >= 1000 ? 'rgba(255, 255, 255, 0.9)' : 'rgba(244, 63, 94, 0.8)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(airX, airY, 35 + (simState.altitude >= 1000 ? (simState.altitude - 1000) * 0.03 : 0), 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(
      simState.altitude >= 1000 ? '☁️ 凝縮中 (雲粒の形成・積雲成長)' : '🔥 未飽和（水蒸気上昇）',
      airX + 55, airY + 4
    );

    // メトリクス更新
    document.getElementById('m-alt').innerText = `${Math.round(simState.altitude)} m`;
    document.getElementById('m-temp').innerText = `${simState.temp.toFixed(1)} ℃`;
    document.getElementById('m-dew').innerText = `${simState.dewPoint.toFixed(1)} ℃`;
    document.getElementById('m-state').innerText = simState.altitude >= 1000 ? '☁️ 飽和・凝縮（雲発生）' : '💧 未飽和（気体）';

    animId = requestAnimationFrame(loopCloud);
  }

  // ==========================================
  // 2. 🌋 地震メカニズム（明確なプレート境界＆固着域）
  // ==========================================
  function addEarthquakeStrain(val) {
    if (simState.earthquakeActive) return;
    simState.strain = Math.min(100, simState.strain + val);
    if (simState.strain >= 100) {
      triggerEarthquake();
    }
  }

  function triggerEarthquake() {
    simState.earthquakeActive = true;
    simState.strain = 100;
    
    // 衝撃波リング生成
    for(let i=0; i<6; i++) {
      simState.seismicWaves.push({ r: 10, alpha: 1, speed: 5 + i*2.5 });
    }
  }

  function loopEarthquake() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (simState.isAutoSubducting && !simState.earthquakeActive) {
      simState.strain += 0.4;
      if (simState.strain >= 100) triggerEarthquake();
    }

    // 画面揺れ演算
    let shakeX = 0, shakeY = 0;
    if (simState.earthquakeActive) {
      shakeX = (Math.random() - 0.5) * 18;
      shakeY = (Math.random() - 0.5) * 18;
    }

    ctx.save();
    ctx.translate(shakeX, shakeY);

    // 海洋水域
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(0, 0, canvas.width, 180);

    // 海底地形（海溝 Trench）
    ctx.fillStyle = '#090d16';
    ctx.fillRect(0, 180, canvas.width, 300);

    // 海洋プレート (Pacific Plate)
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.moveTo(0, 200);
    ctx.lineTo(440, 390);
    ctx.lineTo(340, 480);
    ctx.lineTo(0, 480);
    ctx.closePath();
    ctx.fill();

    // 沈み込みベクトル矢印
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(80, 210); ctx.lineTo(240, 310);
    ctx.stroke();
    // 矢印の頭
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(240, 310, 5, 0, Math.PI*2);
    ctx.fill();

    // 陸側プレート (Continental Plate - 曲げ変形)
    let bendOffset = (simState.strain / 100) * 70; // 引き込まれる量
    if (simState.earthquakeActive) bendOffset *= 0.1; // 跳ね返り

    ctx.fillStyle = '#451a03';
    ctx.beginPath();
    ctx.moveTo(850, 140);
    ctx.lineTo(850, 480);
    ctx.lineTo(340, 480);
    ctx.lineTo(440, 390);
    // 先端の巻き込まれベジェ
    ctx.quadraticCurveTo(400 + bendOffset * 0.4, 300 + bendOffset, 380, 180);
    ctx.closePath();
    ctx.fill();

    // ★★★ プレート境界（固着域 / Fault Boundary Line）の強調表示 ★★★
    let strainGlow = simState.strain / 100;
    ctx.strokeStyle = `rgba(239, 68, 68, ${0.4 + strainGlow * 0.6})`;
    ctx.lineWidth = 6 + strainGlow * 6;
    ctx.beginPath();
    ctx.moveTo(380, 180);
    ctx.lineTo(440, 390);
    ctx.stroke();

    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(380, 180);
    ctx.lineTo(440, 390);
    ctx.stroke();
    ctx.setLineDash([]);

    // 地震波（断熱破砕から同心円）
    simState.seismicWaves.forEach((wave, idx) => {
      ctx.strokeStyle = `rgba(239, 68, 68, ${wave.alpha})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(420, 330, wave.r, 0, Math.PI * 2);
      ctx.stroke();
      wave.r += wave.speed;
      wave.alpha -= 0.015;
      if (wave.alpha <= 0) simState.seismicWaves.splice(idx, 1);
    });

    // 海面の変形（津波 Tsunami）
    ctx.fillStyle = 'rgba(56, 189, 248, 0.75)';
    ctx.beginPath();
    ctx.moveTo(0, 180);
    for (let x = 0; x <= canvas.width; x += 15) {
      let waveH = 0;
      if (simState.earthquakeActive && x > 300) {
        waveH = Math.sin((x + Date.now() * 0.02) * 0.04) * 28;
      }
      ctx.lineTo(x, 180 - waveH);
    }
    ctx.lineTo(canvas.width, 480);
    ctx.lineTo(0, 480);
    ctx.fill();

    ctx.restore();

    // ★★★ オンキャンバス明確ラベル指示 ★★★
    ctx.fillStyle = '#7dd3fc';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('🌊 海洋プレート (沈み込み)', 60, 260);

    ctx.fillStyle = '#fde047';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('⛰️ 陸側プレート (引き込まれ・ひずみ蓄積)', 500, 260);

    ctx.fillStyle = '#ef4444';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('⚡ プレート境界（固着域）', 390, 290);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('📍 海溝 (Trench)', 330, 165);

    // 地震収束
    if (simState.earthquakeActive && simState.seismicWaves.length === 0) {
      simState.earthquakeActive = false;
      simState.strain = 0;
    }

    // メトリクス更新
    document.getElementById('m-strain').innerText = `${Math.round(simState.strain)} %`;
    document.getElementById('m-pstatus').innerText = simState.earthquakeActive ? '💥 震源断層スリップ（跳ね返り）' : (simState.strain > 70 ? '⚠️ ひずみ限界近傍' : 'ひずみ蓄積中');
    document.getElementById('m-mag').innerText = simState.earthquakeActive ? 'M 8.6 巨大地震' : '--';
    document.getElementById('m-tsunami').innerText = simState.earthquakeActive ? '🌊 津波警報 (高さ 8.5m)' : '0.0 m';

    animId = requestAnimationFrame(loopEarthquake);
  }

  // ==========================================
  // 3. ⛰️ フェーン現象（物理的に厳密な温度計算）
  // ==========================================
  function loopFoehn() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (simState.isRunning) {
      simState.airProgress += 0.003;
      if (simState.airProgress > 1.0) simState.airProgress = 0;
    }

    let p = simState.airProgress; // 0.0 (海) -> 0.33 (露点1000m) -> 0.5 (山頂3000m) -> 1.0 (風下平野0m)

    // 現在の高度 (m) と温度 (℃) の厳密計算
    let curAlt = 0;
    let curTemp = 20.0;
    let isRain = false;

    if (p <= 0.5) { // 風上側（上昇）
      curAlt = (p / 0.5) * 3000;
      if (curAlt <= 1000) {
        // 乾燥断熱減率 (-1.0℃/100m)
        curTemp = 20.0 - (curAlt / 100);
      } else {
        // 湿潤断熱減率 (-0.5℃/100m + 潜熱)
        curTemp = 10.0 - ((curAlt - 1000) * 0.005);
        isRain = true;
      }
    } else { // 風下側（降下）
      let descProgress = (p - 0.5) / 0.5; // 0 to 1
      curAlt = 3000 * (1.0 - descProgress);
      // 乾燥断熱昇温 (+1.0℃/100m)
      curTemp = 0.0 + ((3000 - curAlt) / 100);
    }

    // 空気塊の座標計算
    let airX = 80 + p * 680;
    let airY = 410 - (curAlt / 3000) * 290;

    // 背景描画
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 山脈描画
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.moveTo(0, 410);
    ctx.lineTo(80, 410);
    ctx.lineTo(420, 120); // 山頂 (標高3000m)
    ctx.lineTo(760, 410);
    ctx.lineTo(850, 410);
    ctx.lineTo(850, 480);
    ctx.lineTo(0, 480);
    ctx.fill();

    // 稜線ハイライト
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(80, 410);
    ctx.lineTo(420, 120);
    ctx.lineTo(760, 410);
    ctx.stroke();

    // 露点標高1000m線
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    let y1000 = 410 - (1000 / 3000) * 290;
    ctx.beginPath();
    ctx.moveTo(0, y1000); ctx.lineTo(canvas.width, y1000);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#7dd3fc';
    ctx.font = '11px sans-serif';
    ctx.fillText('露点高度 1000m (凝縮開始点)', 15, y1000 - 5);

    // 雨粒パーティクル生成
    if (isRain && Math.random() < 0.7) {
      simState.particles.push(new Particle(airX + (Math.random()-0.5)*30, airY + 10, -0.5, 5, '#38bdf8', 2, 35));
    }

    simState.particles.forEach((pt, idx) => {
      pt.update();
      pt.draw(ctx);
      if (pt.life <= 0) simState.particles.splice(idx, 1);
    });

    // 雲（凝縮域 1000m〜3000m）
    if (p >= 0.16 && p <= 0.5) {
      ctx.fillStyle = 'rgba(241, 245, 249, 0.8)';
      ctx.beginPath();
      ctx.arc(airX - 15, airY - 15, 22, 0, Math.PI * 2);
      ctx.arc(airX + 10, airY - 12, 18, 0, Math.PI * 2);
      ctx.fill();
    }

    // 空気塊ボール
    let ballColor = p > 0.5 ? '#f43f5e' : (isRain ? '#38bdf8' : '#fbbf24');
    ctx.fillStyle = ballColor;
    ctx.beginPath();
    ctx.arc(airX, airY, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(`${curTemp.toFixed(1)}℃`, airX - 18, airY - 24);

    // ★★★ 明確な対比タグ（風上 20℃ vs 風下 30℃） ★★★
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('🌊 風上（海側）: 20.0℃ / 湿潤', 30, 440);

    ctx.fillStyle = '#f43f5e';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('🔥 風下（平野）: 30.0℃ (極度乾燥・+10℃昇温!)', 480, 440);

    // メトリクス更新
    document.getElementById('m-f-cur').innerText = `${curTemp.toFixed(1)} ℃`;

    animId = requestAnimationFrame(loopFoehn);
  }

  // ==========================================
  // 4. 🌊 エルニーニョ / ラニーニャ
  // ==========================================
  function setElninoMode(mode) {
    simState.mode = mode;
    document.querySelectorAll('.el-mode-btn').forEach(btn => {
      btn.classList.remove('bg-blue-600', 'text-white');
      btn.classList.add('bg-slate-800', 'text-slate-300');
    });
    const target = document.getElementById(`mode-${mode}`);
    target.classList.remove('bg-slate-800', 'text-slate-300');
    target.classList.add('bg-blue-600', 'text-white');
  }

  function loopElnino() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let seaGrad = ctx.createLinearGradient(120, 0, 730, 0);
    let offset = 0;

    if (simState.mode === 'normal') {
      seaGrad.addColorStop(0, '#ef4444');
      seaGrad.addColorStop(0.5, '#0284c7');
      seaGrad.addColorStop(1, '#1e3a8a');
      offset = 0;
    } else if (simState.mode === 'elnino') {
      seaGrad.addColorStop(0, '#f97316');
      seaGrad.addColorStop(0.65, '#ef4444');
      seaGrad.addColorStop(1, '#0284c7');
      offset = 180;
    } else if (simState.mode === 'lanina') {
      seaGrad.addColorStop(0, '#dc2626');
      seaGrad.addColorStop(0.3, '#0284c7');
      seaGrad.addColorStop(1, '#0f172a');
      offset = -100;
    }

    ctx.fillStyle = '#090d16';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 海洋描画
    ctx.fillStyle = seaGrad;
    ctx.fillRect(120, 220, 610, 180);

    // サーモクライン（水温急変層）
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(120, 340 + (offset > 0 ? -30 : -10));
    ctx.bezierCurveTo(350, 340 + (offset * 0.4), 500, 260 + (offset * 0.5), 730, 240 + (offset > 0 ? 50 : -20));
    ctx.stroke();

    // 冷水湧昇流
    if (simState.mode !== 'elnino') {
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      let count = simState.mode === 'lanina' ? 4 : 2;
      for(let i=0; i<count; i++) {
        let ux = 680 + i*20;
        ctx.beginPath();
        ctx.moveTo(ux, 380); ctx.lineTo(ux, 260);
        ctx.stroke();
      }
    }

    // 西大陸・東大陸
    ctx.fillStyle = '#15803d';
    ctx.fillRect(40, 180, 80, 220);
    ctx.fillRect(730, 180, 80, 220);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('アジア / インドネシア', 20, 165);
    ctx.fillText('南米 (ペルー沖)', 730, 165);

    // 貿易風粒子
    let windSpeed = simState.mode === 'lanina' ? -4.5 : (simState.mode === 'elnino' ? -0.8 : -2.5);
    if (Math.random() < 0.7) {
      particles.push(new Particle(720, 180 + Math.random()*20, windSpeed, 0, '#f59e0b', 3, 180));
    }

    particles.forEach((p, idx) => {
      p.update();
      p.draw(ctx);
      if (p.life <= 0) particles.splice(idx, 1);
    });

    // 雲クラスタ
    let cloudX = 220 + offset;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.beginPath();
    ctx.arc(cloudX, 100, 35, 0, Math.PI * 2);
    ctx.arc(cloudX - 25, 110, 25, 0, Math.PI * 2);
    ctx.arc(cloudX + 25, 110, 25, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText('🌧️ 活発な積乱雲・大雨エリア', cloudX - 60, 50);

    // メトリクス更新
    document.getElementById('m-wind').innerText = simState.mode === 'lanina' ? '⚡ 非常に強い (東風)' : (simState.mode === 'elnino' ? '⚠️ 弱風・衰退' : '標準 (東風)');
    document.getElementById('m-sst').innerText = simState.mode === 'lanina' ? '- 2.5 ℃ (著しい低温)' : (simState.mode === 'elnino' ? '+ 3.0 ℃ (著しい高温)' : '± 0.0 ℃');
    document.getElementById('m-cloud-loc').innerText = simState.mode === 'elnino' ? '太平洋東部・中央' : (simState.mode === 'lanina' ? '極度に西寄り' : '西太平洋');
    document.getElementById('m-upwelling').innerText = simState.mode === 'elnino' ? '🛑 停止' : (simState.mode === 'lanina' ? '🌊 非常に活発' : '正常');

    animId = requestAnimationFrame(loopElnino);
  }

  // アプリ起動
  switchTab('cloud');
</script>
</body>
</html>
